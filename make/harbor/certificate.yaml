apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: harbor-public-tls
  namespace: shell-artifacts
  labels:
    app.kubernetes.io/name: harbor
spec:
  secretName: harbor-public-tls
  duration: 2160h
  renewBefore: 720h
  privateKey:
    rotationPolicy: Always
    algorithm: RSA
    size: 2048
  usages:
    - server auth
    - digital signature
    - key encipherment
  dnsNames:
    - registry.shell.internal
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: shell-cluster-intermediate
