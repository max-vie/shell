apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: release-feed
  namespace: release-feed
  labels:
    app.kubernetes.io/name: release-feed
    app.kubernetes.io/part-of: shell-platform
spec:
  serviceName: release-feed
  replicas: 1
  podManagementPolicy: OrderedReady
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: release-feed
  template:
    metadata:
      labels:
        app.kubernetes.io/name: release-feed
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8443"
        prometheus.io/scheme: https
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: release-feed
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: release-feed-pull
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: openbao-agent
          image: registry.shell.internal/shell/system/openbao:2.6.1@sha256:5b2486ab0fb90bbc788cc345b0a08616dfb375873ee8be5df3a2fd4d378a67e0
          imagePullPolicy: IfNotPresent
          command:
            - /openbao
            - agent
            - -config=/openbao/config/config-init.hcl
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: openbao-agent-config
              mountPath: /openbao/config
              readOnly: true
            - name: openbao-secrets
              mountPath: /run/secrets
            - name: openbao-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            - name: openbao-ca
              mountPath: /openbao-ca
              readOnly: true
            - name: openbao-tmp
              mountPath: /tmp
      containers:
        - name: release-feed
          image: registry.shell.internal/shell/release-feed@sha256:REPLACE_WITH_TAR_PROMOTED_DIGEST
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_VERSION
              value: unpromoted
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          command:
            - /usr/bin/python
            - /app/app.py
          livenessProbe:
            exec:
              command:
                - /usr/bin/python
                - /app/app.py
                - check
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /usr/bin/python
                - /app/app.py
                - check
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: openbao-secrets
              mountPath: /run/secrets
              readOnly: true
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: openbao-agent-config
          configMap:
            name: release-feed-openbao-agent
            defaultMode: 0444
        - name: openbao-secrets
          emptyDir:
            medium: Memory
        - name: openbao-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: openbao
                  expirationSeconds: 600
        - name: tls
          secret:
            secretName: release-feed-tls
            defaultMode: 0400
        - name: openbao-ca
          secret:
            secretName: release-feed-tls
            defaultMode: 0400
            items:
              - key: ca.crt
                path: ca.crt
        - name: openbao-tmp
          emptyDir:
            medium: Memory
        - name: tmp
          emptyDir:
            medium: Memory
  volumeClaimTemplates:
    - metadata:
        name: data
        annotations:
          helm.sh/resource-policy: keep
        labels:
          app.kubernetes.io/name: release-feed
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        volumeMode: Filesystem
        resources:
          requests:
            storage: 1Gi
