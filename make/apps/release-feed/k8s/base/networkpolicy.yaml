---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: release-feed-default-deny
  namespace: release-feed
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: release-feed-https-ingress
  namespace: release-feed
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: release-feed
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 10.77.0.0/24
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: shell-k6
      ports:
        - protocol: TCP
          port: 8443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: release-feed-openbao-egress
  namespace: release-feed
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: release-feed
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openbao
          podSelector:
            matchLabels:
              app.kubernetes.io/name: openbao
      ports:
        - protocol: TCP
          port: 8200
