---
# MAKE values for WATCH's pinned kube-prometheus-stack policy.
#
# This first slice proves Prometheus scraping and Alertmanager delivery. The
# dashboard layer is deferred, so Grafana stays disabled and has no password
# or other secret in the repository.
grafana:
  enabled: false

prometheus:
  prometheusSpec:
    podMetadata:
      labels:
        release: shell-watch
    retention: 2h
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

alertmanager:
  alertmanagerSpec:
    podMetadata:
      labels:
        release: shell-watch
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
