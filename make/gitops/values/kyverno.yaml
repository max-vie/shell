crds:
  install: true
  migration:
    enabled: false

openreports:
  enabled: false
  installCrds: false

reportsServer:
  enabled: false

existingImagePullSecrets:
  - shell-registry-pull

admissionController:
  replicas: 2
  imagePullSecrets:
    - name: shell-registry-pull
  initContainer:
    image:
      registry: reg.kyverno.io
      repository: kyverno/kyvernopre
      tag: v1.18.2@sha256:cd8cb4a31d25b3992734fb8f24a90ef691c90ce49338c89bea96792160eacb98
      pullPolicy: IfNotPresent
    resources:
      requests: {cpu: 10m, memory: 64Mi}
      limits: {cpu: 100m, memory: 256Mi}
    securityContext:
      runAsUser: 65534
      runAsGroup: 65534
      runAsNonRoot: true
      privileged: false
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities: {drop: [ALL]}
      seccompProfile: {type: RuntimeDefault}
  container:
    image:
      registry: reg.kyverno.io
      repository: kyverno/kyverno
      tag: v1.18.2@sha256:0a540e2ddf74d0d2d3d45f9ef248d7dbc96576accdbcc6a2dd7eaff9fea56504
      pullPolicy: IfNotPresent
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 500m, memory: 384Mi}
    securityContext:
      runAsUser: 65534
      runAsGroup: 65534
      runAsNonRoot: true
      privileged: false
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
      seccompProfile: {type: RuntimeDefault}
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile: {type: RuntimeDefault}
  networkPolicy:
    enabled: false
  serviceMonitor:
    enabled: false

