---
# yamllint disable rule:line-length
# Read-only verification for the MAKE-managed Forgejo and Caddy services.
# This playbook requires delivery-01 to be running and never decrypts SUDO
# handoffs or changes the guest.
- name: Verify Forgejo and Caddy on delivery-01
  hosts: delivery_nodes
  gather_facts: false
  become: true
  pre_tasks:
    - name: Load the path-only MAKE delivery handoff
      ansible.builtin.include_vars:
        file: "{{ make_delivery_vars_path }}"
        name: make_delivery
      become: false

    - name: Validate the public delivery contracts
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ playbook_dir }}/../scripts/render_delivery_handoff.py"
          - --check-only
      changed_when: false
      check_mode: false
      delegate_to: localhost
      become: false
      run_once: true

    - name: Load the public TAR delivery supply
      ansible.builtin.include_vars:
        file: "{{ make_delivery.tar_delivery_supply_path }}"
        name: make_delivery_supply
      delegate_to: localhost
      become: false
      run_once: true

    - name: Inspect the optional runner handoff
      ansible.builtin.stat:
        path: "{{ make_delivery.sudo_forgejo_runner_path }}"
        follow: false
      delegate_to: localhost
      become: false
      register: make_runner_handoff_stat
      run_once: true

    - name: Require a safe runner handoff when runner verification is enabled
      ansible.builtin.assert:
        that:
          - >-
            not make_runner_handoff_stat.stat.exists
            or (
            make_runner_handoff_stat.stat.isreg | default(false)
            and not make_runner_handoff_stat.stat.islnk | default(false)
            and make_runner_handoff_stat.stat.mode == '0600'
            )
        fail_msg: The runner SOPS handoff must be a regular mode-0600 file.
      delegate_to: localhost
      become: false
      run_once: true

    - name: Require the fixed delivery target and HTTPS boundary
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'delivery-01'
          - ansible_host == '10.77.0.211'
          - shell_expected_address == '10.77.0.211'
          - shell_role | default('') == 'delivery'
          - shell_cluster | default('') == 'shared'
          - shell_transport | default('') == 'gcp_iap'
          - make_delivery.proof_status == 'source-only'
          - make_delivery.service_node_id == 'delivery-01'
          - make_delivery.service_fqdn == 'forgejo.shell.internal'
          - make_delivery.service_port == 443
          - make_delivery.service_transport == 'https'
          - make_delivery_supply.contract_id == 'delivery-supply'
          - make_delivery_supply.proof_status == 'source-reference-only'
          - make_delivery_supply.runtime_image_platform == 'linux/amd64'
          - >-
            make_delivery_supply.images.forgejo_runner.repository ==
            'data.forgejo.org/forgejo/runner'
          - make_delivery_supply.images.forgejo_runner.tag == '13'
          - >-
            make_delivery_supply.images.forgejo_runner.digest ==
            'sha256:7fb853bfe73c229be6349398359c0a7bd01fadfd17c106607b2221150b799ed2'
          - make_delivery_supply.images.node.repository == 'docker.io/library/node'
          - make_delivery_supply.images.node.tag == '24-bookworm'
          - >-
            make_delivery_supply.images.node.digest ==
            'sha256:4196d66a565c6f195728d9952f161f4adfe2ad753052a08b7ec7f1c5a6bda42b'
      tags: [always]

  tasks:
    - name: Read the fixed rootless service account UID
      ansible.builtin.command:
        argv: [id, -u, shell-delivery]
      changed_when: false
      register: make_service_uid

    - name: Require a numeric rootless service account UID
      ansible.builtin.assert:
        that:
          - make_service_uid.stdout | trim is match('^[0-9]+$')

    - name: Read the Forgejo user service state
      ansible.builtin.command:
        argv:
          - runuser
          - --user
          - shell-delivery
          - --
          - env
          - HOME=/home/shell-delivery
          - "XDG_RUNTIME_DIR=/run/user/{{ make_service_uid.stdout | trim }}"
          - systemctl
          - --user
          - is-active
          - forgejo.service
      changed_when: false
      register: make_forgejo_service

    - name: Read the Caddy user service state
      ansible.builtin.command:
        argv:
          - runuser
          - --user
          - shell-delivery
          - --
          - env
          - HOME=/home/shell-delivery
          - "XDG_RUNTIME_DIR=/run/user/{{ make_service_uid.stdout | trim }}"
          - systemctl
          - --user
          - is-active
          - caddy.service
      changed_when: false
      register: make_caddy_service

    - name: Read the runner user service state
      ansible.builtin.command:
        argv:
          - runuser
          - --user
          - shell-delivery
          - --
          - env
          - HOME=/home/shell-delivery
          - "XDG_RUNTIME_DIR=/run/user/{{ make_service_uid.stdout | trim }}"
          - systemctl
          - --user
          - is-active
          - runner.service
      changed_when: false
      register: make_runner_service
      when: make_runner_handoff_stat.stat.exists

    - name: Read the rootless Podman socket service state
      ansible.builtin.command:
        argv:
          - runuser
          - --user
          - shell-delivery
          - --
          - env
          - HOME=/home/shell-delivery
          - "XDG_RUNTIME_DIR=/run/user/{{ make_service_uid.stdout | trim }}"
          - systemctl
          - --user
          - is-active
          - podman.socket
      changed_when: false
      register: make_podman_socket_service
      when: make_runner_handoff_stat.stat.exists

    - name: Require the delivery services to be active
      ansible.builtin.assert:
        that:
          - make_forgejo_service.stdout.strip() == 'active'
          - make_caddy_service.stdout.strip() == 'active'
          - >-
            not make_runner_handoff_stat.stat.exists
            or make_runner_service.stdout.strip() == 'active'
          - >-
            not make_runner_handoff_stat.stat.exists
            or make_podman_socket_service.stdout.strip() == 'active'

    - name: Read the rootless Podman containers
      ansible.builtin.command:
        argv:
          - runuser
          - --user
          - shell-delivery
          - --
          - env
          - HOME=/home/shell-delivery
          - "XDG_RUNTIME_DIR=/run/user/{{ make_service_uid.stdout | trim }}"
          - podman
          - ps
          - --format
          - "{{ '{{.Names}} {{.Image}}' }}"
      changed_when: false
      register: make_delivery_containers
      no_log: true

    - name: Require the fixed service containers
      ansible.builtin.assert:
        that:
          - "'forgejo ' in make_delivery_containers.stdout"
          - "'caddy ' in make_delivery_containers.stdout"
          - >-
            not make_runner_handoff_stat.stat.exists
            or 'runner ' in make_delivery_containers.stdout

    - name: Read the runner container runtime configuration
      ansible.builtin.command:
        argv:
          - runuser
          - --user
          - shell-delivery
          - --
          - env
          - HOME=/home/shell-delivery
          - "XDG_RUNTIME_DIR=/run/user/{{ make_service_uid.stdout | trim }}"
          - podman
          - container
          - inspect
          - runner
      changed_when: false
      register: make_runner_inspect_raw
      when: make_runner_handoff_stat.stat.exists

    - name: Parse the runner container runtime configuration
      ansible.builtin.set_fact:
        make_runner_inspect: "{{ (make_runner_inspect_raw.stdout | from_json)[0] }}"
      when: make_runner_handoff_stat.stat.exists

    - name: Require the runner runtime network and mount boundaries
      ansible.builtin.assert:
        that:
          - >-
            make_runner_inspect.ImageDigest ==
            make_delivery_supply.images.forgejo_runner.digest
          - make_runner_inspect.HostConfig.NetworkMode == 'host'
          - >-
            'DOCKER_HOST=unix:///run/podman/podman.sock' in
            make_runner_inspect.Config.Env
          - >-
            ['/data'] ==
            (make_runner_inspect.Mounts |
            selectattr('Source', 'equalto',
            '/srv/shell-delivery/forgejo-runner') |
            map(attribute='Destination') | list)
          - >-
            ['/run/podman/podman.sock'] ==
            (make_runner_inspect.Mounts |
            selectattr('Destination', 'equalto',
            '/run/podman/podman.sock') |
            map(attribute='Destination') | list)
          - >-
            ((make_runner_inspect.Mounts |
            selectattr('Destination', 'equalto',
            '/run/podman/podman.sock') |
            map(attribute='Source') | first) is
            match('^/run/user/[0-9]+/podman/podman\.sock$'))
          - >-
            ['/etc/ssl/certs/shell-platform-ca.crt'] ==
            (make_runner_inspect.Mounts |
            selectattr('Destination', 'equalto',
            '/etc/ssl/certs/shell-platform-ca.crt') |
            map(attribute='Destination') | list)
          - >-
            'docker.sock' not in (make_runner_inspect | to_json)
      when: make_runner_handoff_stat.stat.exists

    - name: Verify the HTTPS endpoint with the public root CA
      ansible.builtin.command:
        argv:
          - curl
          - --fail
          - --silent
          - --show-error
          - --output
          - /dev/null
          - --cacert
          - /usr/local/share/ca-certificates/shell-platform-ca.crt
          - https://forgejo.shell.internal/
      changed_when: false

    - name: Verify the served certificate chain and hostname
      ansible.builtin.command:
        argv:
          - openssl
          - s_client
          - -connect
          - forgejo.shell.internal:443
          - -servername
          - forgejo.shell.internal
          - -CAfile
          - /usr/local/share/ca-certificates/shell-platform-ca.crt
          - -verify_return_error
          - -verify_hostname
          - forgejo.shell.internal
          - -brief
        stdin: ""
        stdin_add_newline: false
      changed_when: false
      failed_when: false
      register: make_served_tls

    - name: Require certificate verification to pass
      ansible.builtin.assert:
        that:
          - >-
            'Verification: OK' in
            (make_served_tls.stdout ~ make_served_tls.stderr)

    - name: Read the installed public root CA digest
      ansible.builtin.command:
        argv:
          - sha256sum
          - /usr/local/share/ca-certificates/shell-platform-ca.crt
      changed_when: false
      register: make_root_ca_digest

    - name: Require the installed public root CA matches the handoff
      ansible.builtin.assert:
        that:
          - make_delivery.service_ca_sha256 in make_root_ca_digest.stdout
          - >-
            'Verified peername: forgejo.shell.internal' in
            (make_served_tls.stdout ~ make_served_tls.stderr)

    - name: Read the public root CA file state
      ansible.builtin.stat:
        path: /usr/local/share/ca-certificates/shell-platform-ca.crt
      register: make_root_ca_state

    - name: Require a regular public root CA with mode 0644
      ansible.builtin.assert:
        that:
          - make_root_ca_state.stat.isreg | default(false)
          - not make_root_ca_state.stat.islnk | default(false)
          - make_root_ca_state.stat.mode == '0644'

    - name: Read the Forgejo TLS file state
      ansible.builtin.stat:
        path: "/srv/shell-delivery/forgejo-tls/{{ item }}"
      loop: [tls.crt, tls.key, ca.crt]
      register: make_tls_files

    - name: Require regular non-symlink TLS files with mode 0600
      ansible.builtin.assert:
        that:
          - item.stat.isreg | default(false)
          - not item.stat.islnk | default(false)
          - item.stat.mode == '0600'
      loop: "{{ make_tls_files.results }}"
      loop_control:
        label: "/srv/shell-delivery/forgejo-tls/{{ item.item }}"

    - name: Read the Forgejo secret environment file state
      ansible.builtin.stat:
        path: /home/shell-delivery/.config/containers/systemd/forgejo.env
      register: make_secret_file

    - name: Require the secret environment file is private
      ansible.builtin.assert:
        that:
          - make_secret_file.stat.isreg | default(false)
          - not make_secret_file.stat.islnk | default(false)
          - make_secret_file.stat.mode == '0600'

    - name: Read the runner configuration file state
      ansible.builtin.stat:
        path: /srv/shell-delivery/forgejo-runner/config.yml
        follow: false
      register: make_runner_config_state
      when: make_runner_handoff_stat.stat.exists

    - name: Require a regular non-symlink runner configuration
      ansible.builtin.assert:
        that:
          - make_runner_config_state.stat.isreg | default(false)
          - not make_runner_config_state.stat.islnk | default(false)
          - make_runner_config_state.stat.mode == '0644'
      when: make_runner_handoff_stat.stat.exists

    - name: Read the runner registration file state
      ansible.builtin.stat:
        path: /srv/shell-delivery/forgejo-runner/.runner
        follow: false
      register: make_runner_registration_state
      when: make_runner_handoff_stat.stat.exists

    - name: Require a private runner registration file
      ansible.builtin.assert:
        that:
          - make_runner_registration_state.stat.isreg | default(false)
          - not make_runner_registration_state.stat.islnk | default(false)
          - make_runner_registration_state.stat.mode == '0600'
      when: make_runner_handoff_stat.stat.exists

    - name: Read rootless container ownership through the user namespace
      ansible.builtin.command:
        argv:
          - runuser
          - --user
          - shell-delivery
          - --
          - env
          - HOME=/home/shell-delivery
          - "XDG_RUNTIME_DIR=/run/user/{{ make_service_uid.stdout | trim }}"
          - podman
          - unshare
          - stat
          - "--format=%u:%g"
          - "{{ item }}"
      loop:
        - /srv/shell-delivery/forgejo
        - /srv/shell-delivery/forgejo-runner
        - /srv/shell-delivery/forgejo-runner/config.yml
        - /srv/shell-delivery/forgejo-runner/.runner
      when:
        - item == '/srv/shell-delivery/forgejo'
          or make_runner_handoff_stat.stat.exists
      changed_when: false
      register: make_rootless_ownership

    - name: Require the mapped container owner for rootless data
      ansible.builtin.assert:
        that:
          - item.stdout | trim == '1000:1000'
      loop: "{{ make_rootless_ownership.results }}"
      when: not item.skipped | default(false)
      loop_control:
        label: "{{ item.item }}"

    - name: Read the rootless Quadlet unit file states
      ansible.builtin.stat:
        path: "/home/shell-delivery/.config/containers/systemd/{{ item }}"
      loop:
        - forgejo.container
        - caddy.container
      register: make_quadlet_files

    - name: Read the runner Quadlet unit state
      ansible.builtin.stat:
        path: /home/shell-delivery/.config/containers/systemd/runner.container
        follow: false
      register: make_runner_quadlet_state
      when: make_runner_handoff_stat.stat.exists

    - name: Require regular non-symlink Quadlet units with mode 0644
      ansible.builtin.assert:
        that:
          - item.stat.isreg | default(false)
          - not item.stat.islnk | default(false)
          - item.stat.mode == '0644'
      loop: "{{ make_quadlet_files.results }}"
      loop_control:
        label: >-
          /home/shell-delivery/.config/containers/systemd/{{ item.item }}

    - name: Require a regular non-symlink runner Quadlet unit
      ansible.builtin.assert:
        that:
          - make_runner_quadlet_state.stat.isreg | default(false)
          - not make_runner_quadlet_state.stat.islnk | default(false)
          - make_runner_quadlet_state.stat.mode == '0644'
      when: make_runner_handoff_stat.stat.exists

    - name: Read the rootless Quadlet unit contents
      ansible.builtin.slurp:
        path: "{{ item.path }}"
      loop:
        - path: >-
            /home/shell-delivery/.config/containers/systemd/forgejo.container
          container: ContainerName=forgejo
          service_label: Label=shell.platform/service=forgejo
          expected_image: >-
            Image={{ make_delivery_supply.images.forgejo.repository }}:{{
            make_delivery_supply.images.forgejo.tag }}@{{
            make_delivery_supply.images.forgejo.digest }}
          required_line: >-
            EnvironmentFile=/home/shell-delivery/.config/containers/systemd/forgejo.env
        - path: >-
            /home/shell-delivery/.config/containers/systemd/caddy.container
          container: ContainerName=caddy
          service_label: Label=shell.platform/service=caddy
          expected_image: >-
            Image={{ make_delivery_supply.images.caddy.repository }}:{{
            make_delivery_supply.images.caddy.tag }}@{{
            make_delivery_supply.images.caddy.digest }}
          required_line: PublishPort=443:443
      register: make_quadlet_contents

    - name: Require the fixed digest-pinned Quadlet contents
      ansible.builtin.assert:
        that:
          - item.item.container in (item.content | b64decode)
          - item.item.service_label in (item.content | b64decode)
          - item.item.required_line in (item.content | b64decode)
          - item.item.expected_image in (item.content | b64decode)
      loop: "{{ make_quadlet_contents.results }}"
      loop_control:
        label: "{{ item.item.path }}"

    - name: Read the runner Quadlet unit
      ansible.builtin.slurp:
        path: /home/shell-delivery/.config/containers/systemd/runner.container
      register: make_runner_quadlet_content
      when: make_runner_handoff_stat.stat.exists

    - name: Require the digest-pinned rootless runner Quadlet
      ansible.builtin.assert:
        that:
          - >-
            ('Image=' ~ make_delivery_supply.images.forgejo_runner.repository ~
            ':' ~ make_delivery_supply.images.forgejo_runner.tag ~ '@' ~
            make_delivery_supply.images.forgejo_runner.digest) in
            (make_runner_quadlet_content.content | b64decode)
          - >-
            'ContainerName=runner' in
            (make_runner_quadlet_content.content | b64decode)
          - >-
            'Network=host' in
            (make_runner_quadlet_content.content | b64decode)
          - >-
            'Volume=/run/user/' in
            (make_runner_quadlet_content.content | b64decode)
          - >-
            'Volume=/run/podman/podman.sock' in
            (make_runner_quadlet_content.content | b64decode)
          - >-
            'Environment=DOCKER_HOST=unix:///run/podman/podman.sock' in
            (make_runner_quadlet_content.content | b64decode)
          - >-
            'Label=shell.platform/service=runner' in
            (make_runner_quadlet_content.content | b64decode)
          - >-
            'docker.sock' not in
            (make_runner_quadlet_content.content | b64decode)
      when: make_runner_handoff_stat.stat.exists

    - name: Read the runner configuration contents
      ansible.builtin.slurp:
        path: /srv/shell-delivery/forgejo-runner/config.yml
      register: make_runner_config_content
      when: make_runner_handoff_stat.stat.exists

    - name: Require the runner job image and socket boundary
      ansible.builtin.assert:
        that:
          - >-
            ('docker:docker://' ~ make_delivery_supply.images.node.repository ~
            ':' ~ make_delivery_supply.images.node.tag ~ '@' ~
            make_delivery_supply.images.node.digest) in
            (make_runner_config_content.content | b64decode)
          - >-
            'docker_host: "-"' in
            (make_runner_config_content.content | b64decode)
          - >-
            '/run/podman/podman.sock' not in
            (make_runner_config_content.content | b64decode)
      when: make_runner_handoff_stat.stat.exists
