---
# MAKE owns the Forgejo and Caddy services on delivery-01. This playbook
# consumes the path-only handoff and fixed TAR pins; SOPS values are decrypted
# only during an explicitly requested mutation run and are never logged.
- name: Deploy Forgejo and Caddy on delivery-01
  hosts: delivery_nodes
  gather_facts: false
  become: true
  vars:
    make_forgejo_repository: codeberg.org/forgejo/forgejo
    make_forgejo_tag: 16.0.3-rootless
    make_runner_repository: data.forgejo.org/forgejo/runner
    make_runner_tag: "13"
    make_runner_job_repository: docker.io/library/node
    make_runner_job_tag: 24-bookworm
    make_caddy_repository: docker.io/library/caddy
    make_caddy_tag: 2.11.4-alpine
    make_service_user: shell-delivery
    make_quadlet_directory: /home/shell-delivery/.config/containers/systemd
    make_forgejo_environment_file: "{{ make_quadlet_directory }}/forgejo.env"
    make_forgejo_admin_environment_file: >-
      {{ make_quadlet_directory }}/forgejo-admin.env
    make_service_root: /srv/shell-delivery
    make_runner_root: "{{ make_service_root }}/forgejo-runner"
    make_runner_config_file: "{{ make_runner_root }}/config.yml"
    make_runner_registration_file: "{{ make_runner_root }}/.runner"
    make_runner_socket: /run/podman/podman.sock
  pre_tasks:
    - name: Load the path-only MAKE delivery handoff
      ansible.builtin.include_vars:
        file: "{{ make_delivery_vars_path }}"
        name: make_delivery
      become: false

    - name: Validate the current public delivery contracts
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ playbook_dir }}/../scripts/render_delivery_handoff.py"
          - --check-only
      changed_when: false
      check_mode: false
      delegate_to: localhost
      become: false
      run_once: true

    - name: Load the public TAR delivery supply
      ansible.builtin.include_vars:
        file: "{{ make_delivery.tar_delivery_supply_path }}"
        name: make_delivery_supply
      delegate_to: localhost
      become: false
      run_once: true

    - name: Load the public SUDO delivery input contract
      ansible.builtin.include_vars:
        file: "{{ make_delivery.sudo_delivery_input_contract_path }}"
        name: make_delivery_inputs
      delegate_to: localhost
      become: false
      run_once: true

    - name: Inspect the optional runner handoff before host mutation
      ansible.builtin.stat:
        path: "{{ make_delivery.sudo_forgejo_runner_path }}"
        follow: false
      delegate_to: localhost
      become: false
      register: make_runner_handoff_stat
      run_once: true

    - name: Reject an unsafe runner handoff before host mutation
      ansible.builtin.assert:
        that:
          - >-
            not make_runner_handoff_stat.stat.exists
            or (
            make_runner_handoff_stat.stat.isreg | default(false)
            and not make_runner_handoff_stat.stat.islnk | default(false)
            and make_runner_handoff_stat.stat.mode == '0600'
            )
        fail_msg: >-
          The optional runner SOPS handoff must be a regular mode-0600 file.
      delegate_to: localhost
      become: false
      run_once: true

    - name: Read the optional runner handoff once before host mutation
      ansible.builtin.slurp:
        path: "{{ make_delivery.sudo_forgejo_runner_path }}"
      delegate_to: localhost
      become: false
      register: make_runner_handoff_ciphertext
      run_once: true
      no_log: true
      when: make_runner_handoff_stat.stat.exists

    - name: Require the fixed delivery handoff and image pins
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'delivery-01'
          - ansible_host == '10.77.0.211'
          - shell_expected_address == '10.77.0.211'
          - shell_role | default('') == 'delivery'
          - shell_cluster | default('') == 'shared'
          - shell_transport | default('') == 'gcp_iap'
          - make_delivery.proof_status == 'source-only'
          - make_delivery.service_node_id == 'delivery-01'
          - make_delivery.service_dns_domain == 'shell.internal'
          - make_delivery.service_dns_server == '10.77.0.210'
          - make_delivery.service_fqdn == 'forgejo.shell.internal'
          - make_delivery.service_port == 443
          - make_delivery.service_transport == 'https'
          - make_service_user == 'shell-delivery'
          - >-
            make_quadlet_directory ==
            '/home/shell-delivery/.config/containers/systemd'
          - make_service_root == '/srv/shell-delivery'
          - make_delivery.init_delivery_preview_path is string
          - make_delivery.init_delivery_preview_path | length > 0
          - make_delivery_supply.contract_id == 'delivery-supply'
          - make_delivery_supply.proof_status == 'source-reference-only'
          - make_delivery_supply.runtime_image_platform == 'linux/amd64'
          - >-
            make_delivery_supply.images.forgejo.repository ==
            make_forgejo_repository
          - make_delivery_supply.images.forgejo.tag == make_forgejo_tag
          - >-
            make_delivery_supply.images.forgejo.digest ==
            'sha256:214f4ae63ee78be1e445e58573c88dc7215e72091210852e0df94eaac1a25685'
          - >-
            make_delivery_supply.images.caddy.repository ==
            make_caddy_repository
          - make_delivery_supply.images.caddy.tag == make_caddy_tag
          - >-
            make_delivery_supply.images.caddy.digest ==
            'sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648'
          - >-
            make_delivery_supply.images.forgejo_runner.repository ==
            make_runner_repository
          - make_delivery_supply.images.forgejo_runner.tag == make_runner_tag
          - >-
            make_delivery_supply.images.forgejo_runner.digest ==
            'sha256:7fb853bfe73c229be6349398359c0a7bd01fadfd17c106607b2221150b799ed2'
          - >-
            make_delivery_supply.images.node.repository ==
            make_runner_job_repository
          - make_delivery_supply.images.node.tag == make_runner_job_tag
          - >-
            make_delivery_supply.images.node.digest ==
            'sha256:4196d66a565c6f195728d9952f161f4adfe2ad753052a08b7ec7f1c5a6bda42b'
          - make_delivery_inputs.proof_status == 'source-only'
          - make_delivery_inputs.private_custody.storage == 'sops-age'
          - >-
            make_delivery_inputs.private_custody.plaintext_values_tracked ==
            false
          - >-
            make_delivery_inputs.private_inputs.bootstrap.path ==
            '.local/sudo/delivery/bootstrap.sops.json'
          - >-
            make_delivery_inputs.private_inputs.forgejo_public_tls.path ==
            '.local/sudo/delivery/forgejo-public-tls.sops.json'
          - >-
            make_delivery_inputs.private_inputs.forgejo_runner.path ==
            '.local/sudo/delivery/forgejo-runner.sops.json'
          - >-
            make_delivery_inputs.private_inputs.forgejo_runner.storage ==
            'sops-age'
        fail_msg: The delivery handoff, SUDO inputs, or TAR image pins changed.
      delegate_to: localhost
      become: false
      run_once: true

    # A check-mode preview proves public source contracts only. In particular,
    # it must not require or decrypt a private SOPS handoff.
    - name: Stop before private input decryption in check mode
      ansible.builtin.meta: end_play
      when: ansible_check_mode

  tasks:
    - name: Deploy the rootless delivery services
      block:
        - name: Read the fixed rootless service account UID
          ansible.builtin.command:
            argv: [id, -u, "{{ make_service_user }}"]
          register: make_service_uid
          changed_when: false
          check_mode: false

        - name: Require a numeric rootless service account UID
          ansible.builtin.assert:
            that:
              - make_service_uid.stdout | trim is match('^[0-9]+$')

        - name: Decrypt the Forgejo bootstrap handoff
          ansible.builtin.command:
            argv:
              - sops
              - --decrypt
              - --output-type
              - yaml
              - "{{ make_delivery.sudo_delivery_bootstrap_path }}"
          environment:
            SOPS_AGE_KEY_FILE: "{{ make_delivery.age_key_path }}"
          register: make_forgejo_bootstrap_raw
          changed_when: false
          check_mode: false
          no_log: true
          delegate_to: localhost
          become: false

        - name: Decrypt the Forgejo TLS handoff
          ansible.builtin.command:
            argv:
              - sops
              - --decrypt
              - --output-type
              - yaml
              - "{{ make_delivery.sudo_forgejo_tls_path }}"
          environment:
            SOPS_AGE_KEY_FILE: "{{ make_delivery.age_key_path }}"
          register: make_forgejo_tls_raw
          changed_when: false
          check_mode: false
          no_log: true
          delegate_to: localhost
          become: false

        - name: Parse the decrypted Forgejo inputs in memory
          ansible.builtin.set_fact:
            make_forgejo_bootstrap: >-
              {{ make_forgejo_bootstrap_raw.stdout | from_yaml }}
            make_forgejo_tls: >-
              {{ make_forgejo_tls_raw.stdout | from_yaml }}
          no_log: true

        - name: Extract the Forgejo input values in memory
          ansible.builtin.set_fact:
            make_forgejo_bootstrap_values: >-
              {{ make_forgejo_bootstrap.forgejo_bootstrap }}
            make_forgejo_tls_values: >-
              {{ make_forgejo_tls.forgejo_public_tls }}
          no_log: true

        - name: Decrypt the optional runner registration handoff
          ansible.builtin.command:
            argv:
              - sops
              - --decrypt
              - --input-type
              - json
              - --output-type
              - json
              - /dev/stdin
            stdin: "{{ make_runner_handoff_ciphertext.content | b64decode }}"
            stdin_add_newline: false
          environment:
            SOPS_AGE_KEY_FILE: "{{ make_delivery.age_key_path }}"
          register: make_runner_raw
          changed_when: false
          check_mode: false
          no_log: true
          delegate_to: localhost
          become: false
          when: make_runner_handoff_stat.stat.exists

        - name: Parse the optional runner handoff in memory
          ansible.builtin.set_fact:
            make_runner_secret: "{{ make_runner_raw.stdout | from_json }}"
          no_log: true
          when: make_runner_handoff_stat.stat.exists

        - name: Require the Forgejo bootstrap and TLS input shapes
          ansible.builtin.assert:
            that:
              - make_forgejo_bootstrap.schema_version == '1.0'
              - make_forgejo_bootstrap.contract_id == 'delivery-input-contract'
              - make_forgejo_bootstrap.class == 'forgejo_bootstrap'
              - make_forgejo_bootstrap_values.admin_username | length > 0
              - make_forgejo_bootstrap_values.admin_password | length > 0
              - make_forgejo_bootstrap_values.security_secret_key | length > 0
              - make_forgejo_bootstrap_values.internal_token | length > 0
              - make_forgejo_bootstrap_values.jwt_secret | length > 0
              - make_forgejo_tls.schema_version == '1.0'
              - make_forgejo_tls.contract_id == 'delivery-input-contract'
              - make_forgejo_tls.class == 'forgejo_public_tls'
              - make_forgejo_tls.dns_sans == ['forgejo.shell.internal']
              - make_forgejo_tls_values.certificate | length > 0
              - make_forgejo_tls_values.private_key | length > 0
              - make_forgejo_tls_values.root_ca | length > 0
            fail_msg: The decrypted Forgejo input shape does not match SUDO.
          no_log: true

        - name: Require the optional runner handoff shape
          ansible.builtin.assert:
            that:
              - make_runner_secret.schema_version == '1.0'
              - make_runner_secret.contract_id == 'delivery-input-contract'
              - make_runner_secret.class == 'forgejo_runner'
              - make_runner_secret.issuer == 'forgejo-after-bootstrap'
              - make_runner_secret.deployment_target == 'delivery-01'
              - make_runner_secret.one_time_bootstrap == true
              - >-
                make_runner_secret.forgejo_runner.url ==
                'https://forgejo.shell.internal'
              - >-
                make_runner_secret.forgejo_runner.name ==
                'shell-runner-01'
              - make_runner_secret.forgejo_runner.uuid | length > 0
              - make_runner_secret.forgejo_runner.token | length > 20
              - >-
                make_runner_secret.forgejo_runner.runner_config.address
                is string
              - >-
                make_runner_secret.forgejo_runner.runner_config.address
                is match('^https://forgejo\\.shell\\.internal')
              - >-
                make_runner_secret.forgejo_runner.runner_config.uuid ==
                make_runner_secret.forgejo_runner.uuid
              - >-
                make_runner_secret.forgejo_runner.runner_config.token ==
                make_runner_secret.forgejo_runner.token
            fail_msg: The decrypted runner handoff does not match SUDO.
          no_log: true
          when: make_runner_handoff_stat.stat.exists

        - name: Bind the fixed image references and service input values
          ansible.builtin.set_fact:
            make_forgejo_image: >-
              {{ make_forgejo_repository }}:{{ make_forgejo_tag }}@
              {{ make_delivery_supply.images.forgejo.digest }}
            make_caddy_image: >-
              {{ make_caddy_repository }}:{{ make_caddy_tag }}@
              {{ make_delivery_supply.images.caddy.digest }}
            make_runner_image: >-
              {{ make_runner_repository }}:{{ make_runner_tag }}@
              {{ make_delivery_supply.images.forgejo_runner.digest }}
            make_runner_job_image: >-
              {{ make_runner_job_repository }}:{{ make_runner_job_tag }}@
              {{ make_delivery_supply.images.node.digest }}
            make_forgejo_secret_key: >-
              {{ make_forgejo_bootstrap_values.security_secret_key }}
            make_internal_token: >-
              {{ make_forgejo_bootstrap_values.internal_token }}
            make_forgejo_jwt_secret: >-
              {{ make_forgejo_bootstrap_values.jwt_secret }}
            make_forgejo_admin_username: >-
              {{ make_forgejo_bootstrap_values.admin_username }}
            make_forgejo_admin_password: >-
              {{ make_forgejo_bootstrap_values.admin_password }}
            make_forgejo_certificate: >-
              {{ make_forgejo_tls_values.certificate }}
            make_forgejo_private_key: >-
              {{ make_forgejo_tls_values.private_key }}
            make_forgejo_tls_root_ca: >-
              {{ make_forgejo_tls_values.root_ca }}
          no_log: true

        - name: Read the pre-deployment sysctl file state
          ansible.builtin.stat:
            path: /etc/sysctl.d/90-shell-rootless-bind.conf
            follow: false
          register: make_previous_sysctl_file

        - name: Read the pre-deployment sysctl file contents
          ansible.builtin.slurp:
            path: /etc/sysctl.d/90-shell-rootless-bind.conf
          register: make_previous_sysctl_contents
          when:
            - make_previous_sysctl_file is defined
            - make_previous_sysctl_file.stat.exists

        - name: Read the pre-deployment root CA file state
          ansible.builtin.stat:
            path: /usr/local/share/ca-certificates/shell-platform-ca.crt
            follow: false
          register: make_previous_root_ca_file

        - name: Read the pre-deployment root CA file contents
          ansible.builtin.slurp:
            path: /usr/local/share/ca-certificates/shell-platform-ca.crt
          register: make_previous_root_ca_contents
          when: make_previous_root_ca_file.stat.exists

        - name: Read the pre-deployment unprivileged port boundary
          ansible.builtin.command:
            argv: [sysctl, --values, net.ipv4.ip_unprivileged_port_start]
          changed_when: false
          register: make_previous_unprivileged_port_start

        - name: Read the pre-deployment Podman socket enablement
          ansible.builtin.command:
            argv:
              - runuser
              - --user
              - "{{ make_service_user }}"
              - --
              - env
              - HOME=/home/shell-delivery
              - "XDG_RUNTIME_DIR=/run/user/{{ make_service_uid.stdout | trim }}"
              - systemctl
              - --user
              - is-enabled
              - podman.socket
          changed_when: false
          failed_when: false
          register: make_previous_podman_socket_enabled
          when: make_runner_handoff_stat.stat.exists

        - name: Read the pre-deployment Podman socket state
          ansible.builtin.command:
            argv:
              - runuser
              - --user
              - "{{ make_service_user }}"
              - --
              - env
              - HOME=/home/shell-delivery
              - "XDG_RUNTIME_DIR=/run/user/{{ make_service_uid.stdout | trim }}"
              - systemctl
              - --user
              - is-active
              - podman.socket
          changed_when: false
          failed_when: false
          register: make_previous_podman_socket_active
          when: make_runner_handoff_stat.stat.exists

        - name: Read the pre-deployment container restore enablement
          ansible.builtin.command:
            argv:
              - runuser
              - --user
              - "{{ make_service_user }}"
              - --
              - env
              - HOME=/home/shell-delivery
              - "XDG_RUNTIME_DIR=/run/user/{{ make_service_uid.stdout | trim }}"
              - systemctl
              - --user
              - is-enabled
              - podman-restart.service
          changed_when: false
          failed_when: false
          register: make_previous_podman_restart_enabled

        - name: Read the pre-deployment container restore state
          ansible.builtin.command:
            argv:
              - runuser
              - --user
              - "{{ make_service_user }}"
              - --
              - env
              - HOME=/home/shell-delivery
              - "XDG_RUNTIME_DIR=/run/user/{{ make_service_uid.stdout | trim }}"
              - systemctl
              - --user
              - is-active
              - podman-restart.service
          changed_when: false
          failed_when: false
          register: make_previous_podman_restart_active

        - name: Mark the delivery mutation as started
          ansible.builtin.set_fact:
            make_delivery_mutation_started: true

        - name: Allow rootless Caddy to bind the HTTPS port
          ansible.builtin.copy:
            dest: /etc/sysctl.d/90-shell-rootless-bind.conf
            content: "net.ipv4.ip_unprivileged_port_start = 80\n"
            owner: root
            group: root
            mode: "0644"
          notify: Reload rootless HTTPS bind setting

        - name: Install the public SHELL root CA
          ansible.builtin.copy:
            src: "{{ make_delivery.service_ca_path }}"
            dest: /usr/local/share/ca-certificates/shell-platform-ca.crt
            owner: root
            group: root
            mode: "0644"
          notify: Refresh the Debian CA bundle

        - name: Read the installed public root CA digest
          ansible.builtin.command:
            argv:
              - sha256sum
              - /usr/local/share/ca-certificates/shell-platform-ca.crt
          register: make_root_ca_digest
          changed_when: false

        - name: Require the installed public root CA digest
          ansible.builtin.assert:
            that:
              - >-
                make_delivery.service_ca_sha256 in make_root_ca_digest.stdout
            fail_msg: The installed public root CA does not match the handoff.

        - name: Create the rootless Quadlet directory
          ansible.builtin.file:
            path: "{{ make_quadlet_directory }}"
            state: directory
            owner: "{{ make_service_user }}"
            group: "{{ make_service_user }}"
            mode: "0700"

        - name: Create the Forgejo and Caddy data directories
          ansible.builtin.file:
            path: "{{ make_service_root }}/{{ item }}"
            state: directory
            owner: "{{ make_service_user }}"
            group: "{{ make_service_user }}"
            mode: "0750"
          loop:
            - caddy-config
            - caddy-data

        - name: Create the rootless Forgejo data directory
          ansible.builtin.file:
            path: "{{ make_service_root }}/forgejo"
            state: directory
            owner: "{{ make_service_user }}"
            group: "{{ make_service_user }}"
            mode: "0750"

        - name: Create the rootless runner data directory
          ansible.builtin.file:
            path: "{{ make_runner_root }}"
            state: directory
            owner: "{{ make_service_user }}"
            group: "{{ make_service_user }}"
            mode: "0750"
          when: make_runner_handoff_stat.stat.exists

        - name: Create the Forgejo TLS directory
          ansible.builtin.file:
            path: "{{ make_service_root }}/forgejo-tls"
            state: directory
            owner: "{{ make_service_user }}"
            group: "{{ make_service_user }}"
            mode: "0700"

        - name: Write the Forgejo TLS files with private permissions
          ansible.builtin.copy:
            dest: "{{ make_service_root }}/forgejo-tls/{{ item.name }}"
            content: "{{ item.value }}\n"
            owner: "{{ make_service_user }}"
            group: "{{ make_service_user }}"
            mode: "0600"
          loop:
            - name: tls.crt
              value: "{{ make_forgejo_certificate }}"
            - name: tls.key
              value: "{{ make_forgejo_private_key }}"
            - name: ca.crt
              value: "{{ make_forgejo_tls_root_ca }}"
          no_log: true

        - name: Write the Caddy reverse-proxy configuration
          ansible.builtin.copy:
            dest: "{{ make_service_root }}/caddy-config/Caddyfile"
            content: |
              forgejo.shell.internal {
                tls /tls/tls.crt /tls/tls.key
                reverse_proxy forgejo:3000
              }
            owner: "{{ make_service_user }}"
            group: "{{ make_service_user }}"
            mode: "0644"

        - name: Write the Forgejo secret environment file
          ansible.builtin.copy:
            dest: "{{ make_forgejo_environment_file }}"
            content: |
              FORGEJO__security__SECRET_KEY={{ make_forgejo_secret_key }}
              FORGEJO__security__INTERNAL_TOKEN={{ make_internal_token }}
              FORGEJO__oauth2__JWT_SECRET={{ make_forgejo_jwt_secret }}
            owner: "{{ make_service_user }}"
            group: "{{ make_service_user }}"
            mode: "0600"
          no_log: true

        - name: Write the Forgejo Quadlet unit
          ansible.builtin.copy:
            dest: "{{ make_quadlet_directory }}/forgejo.container"
            content: |
              [Unit]
              Description=Forgejo web service
              After=network-online.target
              Wants=network-online.target

              [Container]
              Image={{ make_forgejo_image }}
              ContainerName=forgejo
              Network=forgejo-net
              Volume=/srv/shell-delivery/forgejo:/var/lib/gitea
              EnvironmentFile={{ make_forgejo_environment_file }}
              Environment=FORGEJO__server__DOMAIN=forgejo.shell.internal
              Environment=FORGEJO__server__ROOT_URL=https://forgejo.shell.internal/
              Environment=FORGEJO__server__HTTP_PORT=3000
              Environment=FORGEJO__security__INSTALL_LOCK=true
              UserNS=keep-id
              Label=shell.platform/owner=make
              Label=shell.platform/service=forgejo

              [Service]
              Restart=on-failure

              [Install]
              WantedBy=default.target
            owner: "{{ make_service_user }}"
            group: "{{ make_service_user }}"
            mode: "0644"

        - name: Enable the rootless Podman API socket for the runner
          ansible.builtin.command:
            argv:
              - runuser
              - --user
              - "{{ make_service_user }}"
              - --
              - env
              - HOME=/home/shell-delivery
              - "XDG_RUNTIME_DIR=/run/user/{{ make_service_uid.stdout | trim }}"
              - systemctl
              - --user
              - enable
              - --now
              - podman.socket
          changed_when: false
          when: make_runner_handoff_stat.stat.exists

        # yamllint disable rule:line-length
        - name: Write the runner configuration
          ansible.builtin.copy:
            dest: "{{ make_runner_config_file }}"
            content: |
              log:
                level: info
                job_level: info
              runner:
                file: /data/.runner
                capacity: 1
                timeout: 30m
                shutdown_timeout: 1m
                insecure: false
                labels:
                  - docker:docker://{{ make_runner_job_image }}
                envs:
                  SSL_CERT_FILE: /usr/local/share/ca-certificates/shell-platform-ca.crt
              cache:
                enabled: true
                dir: /data/cache
              container:
                network: ""
                docker_host: "-"
                valid_volumes:
                  - /usr/local/share/ca-certificates/shell-platform-ca.crt
                options: >-
                  --volume /usr/local/share/ca-certificates/shell-platform-ca.crt:
                  /etc/ssl/certs/ca-certificates.crt:ro
              host:
                workdir_parent: /data/workspaces
            owner: "{{ make_service_user }}"
            group: "{{ make_service_user }}"
            mode: "0644"
          when: make_runner_handoff_stat.stat.exists

        - name: Write the registered runner state
          ansible.builtin.copy:
            dest: "{{ make_runner_registration_file }}"
            content: "{{ make_runner_secret.forgejo_runner.runner_config | to_json }}\n"
            owner: "{{ make_service_user }}"
            group: "{{ make_service_user }}"
            mode: "0600"
          no_log: true
          when: make_runner_handoff_stat.stat.exists

        - name: Map the Forgejo data owner through the rootless user namespace
          ansible.builtin.command:
            argv:
              - runuser
              - --user
              - "{{ make_service_user }}"
              - --
              - env
              - HOME=/home/shell-delivery
              - "XDG_RUNTIME_DIR=/run/user/{{ make_service_uid.stdout | trim }}"
              - podman
              - unshare
              - chown
              - "1000:1000"
              - "{{ make_service_root }}/forgejo"
          changed_when: false

        - name: Map the runner inputs through the rootless user namespace
          ansible.builtin.command:
            argv:
              - runuser
              - --user
              - "{{ make_service_user }}"
              - --
              - env
              - HOME=/home/shell-delivery
              - "XDG_RUNTIME_DIR=/run/user/{{ make_service_uid.stdout | trim }}"
              - podman
              - unshare
              - chown
              - "1000:1000"
              - "{{ make_runner_root }}"
              - "{{ make_runner_config_file }}"
              - "{{ make_runner_registration_file }}"
          changed_when: false
          when: make_runner_handoff_stat.stat.exists

        - name: Write the runner Quadlet unit
          ansible.builtin.copy:
            dest: "{{ make_quadlet_directory }}/runner.container"
            content: |
              [Unit]
              Description=Forgejo Actions runner
              After=forgejo.service podman.socket
              Wants=forgejo.service podman.socket

              [Container]
              Image={{ make_runner_image }}
              ContainerName=runner
              Network=host
              UserNS=keep-id
              Volume={{ make_runner_root }}:/data
              Volume=/run/user/{{ make_service_uid.stdout | trim }}/podman/podman.sock:{{ make_runner_socket }}
              Volume=/usr/local/share/ca-certificates/shell-platform-ca.crt:/etc/ssl/certs/shell-platform-ca.crt:ro
              Environment=DOCKER_HOST=unix://{{ make_runner_socket }}
              Environment=SSL_CERT_FILE=/etc/ssl/certs/shell-platform-ca.crt
              Exec=/bin/forgejo-runner daemon --config /data/config.yml
              Label=shell.platform/owner=make
              Label=shell.platform/service=runner

              [Service]
              Restart=on-failure

              [Install]
              WantedBy=default.target
            owner: "{{ make_service_user }}"
            group: "{{ make_service_user }}"
            mode: "0644"
          when: make_runner_handoff_stat.stat.exists

        # yamllint enable rule:line-length

        - name: Write the Caddy Quadlet unit
          ansible.builtin.copy:
            dest: "{{ make_quadlet_directory }}/caddy.container"
            content: |
              [Unit]
              Description=Caddy reverse proxy for Forgejo
              After=forgejo.service
              Wants=forgejo.service

              [Container]
              Image={{ make_caddy_image }}
              ContainerName=caddy
              Network=forgejo-net
              PublishPort=443:443
              Volume=/srv/shell-delivery/caddy-config:/etc/caddy:ro
              Volume=/srv/shell-delivery/caddy-data:/data
              Volume=/srv/shell-delivery/forgejo-tls:/tls:ro
              Label=shell.platform/owner=make
              Label=shell.platform/service=caddy

              [Service]
              Restart=on-failure

              [Install]
              WantedBy=default.target
            owner: "{{ make_service_user }}"
            group: "{{ make_service_user }}"
            mode: "0644"

        - name: Pull the pinned Forgejo image
          ansible.builtin.command:
            argv:
              - runuser
              - --user
              - "{{ make_service_user }}"
              - --
              - env
              - HOME=/home/shell-delivery
              - "XDG_RUNTIME_DIR=/run/user/{{ make_service_uid.stdout | trim }}"
              - podman
              - pull
              - "{{ make_forgejo_image }}"
          changed_when: false

        - name: Pull the pinned Caddy image
          ansible.builtin.command:
            argv:
              - runuser
              - --user
              - "{{ make_service_user }}"
              - --
              - env
              - HOME=/home/shell-delivery
              - "XDG_RUNTIME_DIR=/run/user/{{ make_service_uid.stdout | trim }}"
              - podman
              - pull
              - "{{ make_caddy_image }}"
          changed_when: false

        - name: Pull the pinned Forgejo runner image
          ansible.builtin.command:
            argv:
              - runuser
              - --user
              - "{{ make_service_user }}"
              - --
              - env
              - HOME=/home/shell-delivery
              - "XDG_RUNTIME_DIR=/run/user/{{ make_service_uid.stdout | trim }}"
              - podman
              - pull
              - "{{ make_runner_image }}"
          changed_when: false
          when: make_runner_handoff_stat.stat.exists

        - name: Pull the pinned runner job image
          ansible.builtin.command:
            argv:
              - runuser
              - --user
              - "{{ make_service_user }}"
              - --
              - env
              - HOME=/home/shell-delivery
              - "XDG_RUNTIME_DIR=/run/user/{{ make_service_uid.stdout | trim }}"
              - podman
              - pull
              - "{{ make_runner_job_image }}"
          changed_when: false
          when: make_runner_handoff_stat.stat.exists

        - name: Reload the rootless user systemd manager
          ansible.builtin.command:
            argv:
              - runuser
              - --user
              - "{{ make_service_user }}"
              - --
              - env
              - HOME=/home/shell-delivery
              - "XDG_RUNTIME_DIR=/run/user/{{ make_service_uid.stdout | trim }}"
              - systemctl
              - --user
              - daemon-reload
          changed_when: false

        - name: Check for the delivery container network
          ansible.builtin.command:
            argv:
              - runuser
              - --user
              - "{{ make_service_user }}"
              - --
              - env
              - HOME=/home/shell-delivery
              - "XDG_RUNTIME_DIR=/run/user/{{ make_service_uid.stdout | trim }}"
              - podman
              - network
              - exists
              - forgejo-net
          register: make_network_exists
          changed_when: false
          failed_when: make_network_exists.rc not in [0, 1]

        - name: Create the fixed delivery container network
          ansible.builtin.command:
            argv:
              - runuser
              - --user
              - "{{ make_service_user }}"
              - --
              - env
              - HOME=/home/shell-delivery
              - "XDG_RUNTIME_DIR=/run/user/{{ make_service_uid.stdout | trim }}"
              - podman
              - network
              - create
              - forgejo-net
          when: make_network_exists.rc == 1
          changed_when: true

        - name: Enable the rootless container restore service
          ansible.builtin.command:
            argv:
              - runuser
              - --user
              - "{{ make_service_user }}"
              - --
              - env
              - HOME=/home/shell-delivery
              - "XDG_RUNTIME_DIR=/run/user/{{ make_service_uid.stdout | trim }}"
              - systemctl
              - --user
              - enable
              - --now
              - podman-restart.service
          changed_when: false

        - name: Start Forgejo and Caddy
          ansible.builtin.command:
            argv:
              - runuser
              - --user
              - "{{ make_service_user }}"
              - --
              - env
              - HOME=/home/shell-delivery
              - "XDG_RUNTIME_DIR=/run/user/{{ make_service_uid.stdout | trim }}"
              - systemctl
              - --user
              - start
              - forgejo.service
              - caddy.service
          changed_when: false

        - name: Mark the delivery services as started
          ansible.builtin.set_fact:
            make_delivery_services_started: true

        - name: Mark the runner mutation as started
          ansible.builtin.set_fact:
            make_runner_started: true
          when: make_runner_handoff_stat.stat.exists

        - name: Start the Forgejo Actions runner service
          ansible.builtin.command:
            argv:
              - runuser
              - --user
              - "{{ make_service_user }}"
              - --
              - env
              - HOME=/home/shell-delivery
              - "XDG_RUNTIME_DIR=/run/user/{{ make_service_uid.stdout | trim }}"
              - systemctl
              - --user
              - restart
              - runner.service
          changed_when: false
          when: make_runner_handoff_stat.stat.exists
          register: make_runner_start

        - name: Wait for the Forgejo HTTPS endpoint
          ansible.builtin.command:
            argv:
              - curl
              - --fail
              - --silent
              - --show-error
              - --output
              - /dev/null
              - --cacert
              - /usr/local/share/ca-certificates/shell-platform-ca.crt
              - https://forgejo.shell.internal/
          register: make_forgejo_https
          changed_when: false
          retries: 30
          delay: 2
          until: make_forgejo_https.rc == 0

        - name: Write the short-lived Forgejo administrator input
          ansible.builtin.copy:
            dest: "{{ make_forgejo_admin_environment_file }}"
            content: >-
              FORGEJO_ADMIN_PASSWORD_B64={{
              make_forgejo_admin_password | b64encode }}
            owner: "{{ make_service_user }}"
            group: "{{ make_service_user }}"
            mode: "0600"
          no_log: true

        # Forgejo 16 accepts a chosen administrator password only through its
        # --password flag. The short-lived env file keeps it out of the host
        # Ansible and Podman argv, but a privileged in-container observer can
        # still inspect the Forgejo process argv during this bootstrap step.
        - name: Ensure the Forgejo administrator exists
          ansible.builtin.command:
            argv:
              - runuser
              - --user
              - "{{ make_service_user }}"
              - --
              - env
              - HOME=/home/shell-delivery
              - "XDG_RUNTIME_DIR=/run/user/{{ make_service_uid.stdout | trim }}"
              - podman
              - exec
              - --env-file
              - "{{ make_forgejo_admin_environment_file }}"
              - forgejo
              - sh
              - -ec
              - >-
                admin_password="$(printf '%s'
                "$FORGEJO_ADMIN_PASSWORD_B64" | base64 -d)";
                exec forgejo admin user create --username "$1"
                --password "$admin_password"
                --email admin@shell.internal --admin
              - forgejo-admin
              - "{{ make_forgejo_admin_username }}"
          register: make_admin_create
          changed_when: false
          failed_when: >-
            make_admin_create.rc not in [0, 1]
            or (make_admin_create.rc == 1
            and 'already exists' not in make_admin_create.stderr | lower)
          no_log: true

        - name: Remove the short-lived Forgejo administrator input
          ansible.builtin.file:
            path: "{{ make_forgejo_admin_environment_file }}"
            state: absent
          no_log: true

      rescue:
        - name: Stop the runner after an incomplete runner mutation
          ansible.builtin.command:
            argv:
              - runuser
              - --user
              - "{{ make_service_user }}"
              - --
              - env
              - HOME=/home/shell-delivery
              - "XDG_RUNTIME_DIR=/run/user/{{ make_service_uid.stdout | trim }}"
              - systemctl
              - --user
              - stop
              - runner.service
          when: make_runner_started | default(false)
          changed_when: false
          failed_when: false

        - name: Stop services after an incomplete delivery mutation
          ansible.builtin.command:
            argv:
              - runuser
              - --user
              - "{{ make_service_user }}"
              - --
              - env
              - HOME=/home/shell-delivery
              - "XDG_RUNTIME_DIR=/run/user/{{ make_service_uid.stdout | trim }}"
              - systemctl
              - --user
              - stop
              - forgejo.service
              - caddy.service
          when: make_delivery_services_started | default(false)
          changed_when: false
          failed_when: false

        - name: Remove only the generated Quadlet units after failure
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "{{ make_quadlet_directory }}/forgejo.container"
            - "{{ make_quadlet_directory }}/caddy.container"
          when: make_delivery_mutation_started | default(false)

        - name: Remove the generated runner unit after runner failure
          ansible.builtin.file:
            path: "{{ make_quadlet_directory }}/runner.container"
            state: absent
          when:
            - make_delivery_mutation_started | default(false)
            - make_runner_handoff_stat.stat.exists

        - name: Remove only the generated secret and TLS files after failure
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "{{ make_forgejo_environment_file }}"
            - "{{ make_forgejo_admin_environment_file }}"
            - "{{ make_service_root }}/forgejo-tls/tls.crt"
            - "{{ make_service_root }}/forgejo-tls/tls.key"
            - "{{ make_service_root }}/forgejo-tls/ca.crt"
          when: make_delivery_mutation_started | default(false)
          no_log: true

        - name: Remove generated runner inputs after runner failure
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "{{ make_runner_config_file }}"
            - "{{ make_runner_registration_file }}"
          when:
            - make_delivery_mutation_started | default(false)
            - make_runner_handoff_stat.stat.exists
          no_log: true

        - name: Reload the user manager after removing generated units
          ansible.builtin.command:
            argv:
              - runuser
              - --user
              - "{{ make_service_user }}"
              - --
              - env
              - HOME=/home/shell-delivery
              - "XDG_RUNTIME_DIR=/run/user/{{ make_service_uid.stdout | trim }}"
              - systemctl
              - --user
              - daemon-reload
          when: make_delivery_mutation_started | default(false)
          changed_when: false
          failed_when: false

        - name: Remove the delivery network created by the failed run
          ansible.builtin.command:
            argv:
              - runuser
              - --user
              - "{{ make_service_user }}"
              - --
              - env
              - HOME=/home/shell-delivery
              - "XDG_RUNTIME_DIR=/run/user/{{ make_service_uid.stdout | trim }}"
              - podman
              - network
              - rm
              - forgejo-net
          when:
            - make_network_exists is defined
            - make_network_exists.rc == 1
          changed_when: false
          failed_when: false

        - name: Stop the Podman socket started by the failed run
          ansible.builtin.command:
            argv:
              - runuser
              - --user
              - "{{ make_service_user }}"
              - --
              - env
              - HOME=/home/shell-delivery
              - "XDG_RUNTIME_DIR=/run/user/{{ make_service_uid.stdout | trim }}"
              - systemctl
              - --user
              - stop
              - podman.socket
          when:
            - make_previous_podman_socket_active is defined
            - make_previous_podman_socket_active.stdout | trim != 'active'
          changed_when: false
          failed_when: false

        - name: Disable the Podman socket enabled by the failed run
          ansible.builtin.command:
            argv:
              - runuser
              - --user
              - "{{ make_service_user }}"
              - --
              - env
              - HOME=/home/shell-delivery
              - "XDG_RUNTIME_DIR=/run/user/{{ make_service_uid.stdout | trim }}"
              - systemctl
              - --user
              - disable
              - podman.socket
          when:
            - make_previous_podman_socket_enabled is defined
            - make_previous_podman_socket_enabled.stdout | trim != 'enabled'
          changed_when: false
          failed_when: false

        - name: Stop the container restore service started by the failed run
          ansible.builtin.command:
            argv:
              - runuser
              - --user
              - "{{ make_service_user }}"
              - --
              - env
              - HOME=/home/shell-delivery
              - "XDG_RUNTIME_DIR=/run/user/{{ make_service_uid.stdout | trim }}"
              - systemctl
              - --user
              - stop
              - podman-restart.service
          when:
            - make_previous_podman_restart_active is defined
            - make_previous_podman_restart_active.stdout | trim != 'active'
          changed_when: false
          failed_when: false

        - name: Disable the container restore service enabled by the failed run
          ansible.builtin.command:
            argv:
              - runuser
              - --user
              - "{{ make_service_user }}"
              - --
              - env
              - HOME=/home/shell-delivery
              - "XDG_RUNTIME_DIR=/run/user/{{ make_service_uid.stdout | trim }}"
              - systemctl
              - --user
              - disable
              - podman-restart.service
          when:
            - make_previous_podman_restart_enabled is defined
            - make_previous_podman_restart_enabled.stdout | trim != 'enabled'
          changed_when: false
          failed_when: false

        - name: Restore the previous rootless-bind sysctl file
          ansible.builtin.copy:
            dest: /etc/sysctl.d/90-shell-rootless-bind.conf
            content: "{{ make_previous_sysctl_contents.content | b64decode }}"
            owner: "{{ make_previous_sysctl_file.stat.pw_name }}"
            group: "{{ make_previous_sysctl_file.stat.gr_name }}"
            mode: "{{ make_previous_sysctl_file.stat.mode }}"
          when: make_previous_sysctl_file.stat.exists

        - name: Remove the rootless-bind sysctl file created by the failed run
          ansible.builtin.file:
            path: /etc/sysctl.d/90-shell-rootless-bind.conf
            state: absent
          when:
            - make_previous_sysctl_file is defined
            - not make_previous_sysctl_file.stat.exists

        - name: Restore the previous unprivileged port boundary
          ansible.builtin.command:
            argv:
              - sysctl
              - --write
              - >-
                net.ipv4.ip_unprivileged_port_start={{
                make_previous_unprivileged_port_start.stdout | trim }}
          changed_when: false
          failed_when: false
          when: make_previous_unprivileged_port_start is defined

        - name: Restore the previous public root CA file
          ansible.builtin.copy:
            dest: /usr/local/share/ca-certificates/shell-platform-ca.crt
            content: "{{ make_previous_root_ca_contents.content | b64decode }}"
            owner: "{{ make_previous_root_ca_file.stat.pw_name }}"
            group: "{{ make_previous_root_ca_file.stat.gr_name }}"
            mode: "{{ make_previous_root_ca_file.stat.mode }}"
          when:
            - make_previous_root_ca_file is defined
            - make_previous_root_ca_file.stat.exists

        - name: Remove the public root CA file created by the failed run
          ansible.builtin.file:
            path: /usr/local/share/ca-certificates/shell-platform-ca.crt
            state: absent
          when:
            - make_previous_root_ca_file is defined
            - not make_previous_root_ca_file.stat.exists

        - name: Refresh the CA bundle after restoring the previous state
          ansible.builtin.command:
            argv: [update-ca-certificates]
          changed_when: false
          failed_when: false
          when: make_previous_root_ca_file is defined

        - name: Fail the delivery play after cleanup
          ansible.builtin.fail:
            msg: >-
              Forgejo and Caddy delivery failed; generated service inputs were
              cleaned up.

  handlers:
    - name: Reload rootless HTTPS bind setting
      ansible.builtin.command:
        argv: [sysctl, --load, /etc/sysctl.d/90-shell-rootless-bind.conf]
      changed_when: false

    - name: Refresh the Debian CA bundle
      ansible.builtin.command:
        argv: [update-ca-certificates]
      changed_when: false
