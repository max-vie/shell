---
# Prepare GCP hosts for MAKE-owned platform workloads.
# This playbook is source-only until an explicit INIT approval supplies the
# private inventory.
- name: Configure GCP platform add-ons
  hosts: "{{ shell_platform_target_group }}"
  serial: 1
  gather_facts: false
  any_errors_fatal: true
  become: true
  vars_files:
    - ../vars/platform-addons.yml
  pre_tasks:
    - name: Require the fixed GCP platform target
      ansible.builtin.assert:
        that:
          - shell_platform_cluster_name == 'gcp'
          - shell_platform_target_group == 'gcp_k3s_servers'
          - ansible_play_hosts_all == groups.gcp_k3s_servers
          - groups.gcp_k3s_servers | length == 3
          - inventory_hostname in ['gcp-k3s-01', 'gcp-k3s-02', 'gcp-k3s-03']
          - hostvars[inventory_hostname].shell_cluster | default('') == 'gcp'
          - hostvars[inventory_hostname].shell_role | default('') == 'k3s'
          - hostvars[inventory_hostname].shell_operating_system | default('') == 'debian-13'
        fail_msg: The platform host playbook accepts only the fixed GCP K3s group.

    - name: Stop before platform connections in check mode
      ansible.builtin.meta: end_play
      when: ansible_check_mode

    - name: Wait for the selected K3s node
      ansible.builtin.wait_for_connection:
        connect_timeout: 10
        timeout: 300

  tasks:
    - name: Install Longhorn host prerequisites
      ansible.builtin.apt:
        name: "{{ shell_platform_required_packages }}"
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Inspect the dedicated Longhorn data disk
      ansible.builtin.command:
        argv:
          - blkid
          - -s
          - TYPE
          - -o
          - value
          - "{{ shell_platform_data_device }}"
      register: shell_platform_filesystem
      changed_when: false
      failed_when: shell_platform_filesystem.rc not in [0, 2]

    - name: Inspect the dedicated disk topology
      ansible.builtin.command:
        argv:
          - lsblk
          - --json
          - --output
          - NAME,TYPE,MOUNTPOINTS
          - "{{ shell_platform_data_device }}"
      register: shell_platform_disk_topology_raw
      changed_when: false

    - name: Require a safe dedicated disk topology
      ansible.builtin.assert:
        that:
          - >-
            shell_platform_disk_topology_raw.stdout | from_json
            | shell_platform_safe_disk_topology(
                shell_platform_filesystem.rc,
                shell_platform_data_mount
              )
        fail_msg: >-
          The dedicated disk must be unpartitioned and either unmounted or
          mounted only at the declared Longhorn path.

    - name: Refuse an unexpected Longhorn data disk
      ansible.builtin.assert:
        that:
          - >-
            shell_platform_filesystem.stdout | trim == 'ext4'
            or (
              shell_platform_filesystem.rc == 2
              and shell_platform_format_data_disk | bool
            )
        fail_msg: >-
          The dedicated Longhorn disk must already be ext4. Set the explicit
          format gate only after reviewing the target disk and approval.

    - name: Format an explicitly approved disk with no recognized filesystem
      ansible.builtin.command:
        argv:
          - mkfs.ext4
          - -F
          - -L
          - SHELL_LONGHORN
          - "{{ shell_platform_data_device }}"
      when:
        - shell_platform_filesystem.rc == 2
        - shell_platform_format_data_disk | bool
      changed_when: true

    - name: Mount the dedicated Longhorn data disk
      ansible.posix.mount:
        path: "{{ shell_platform_data_mount }}"
        src: "{{ shell_platform_data_device }}"
        fstype: ext4
        opts: noatime
        state: mounted

    - name: Ensure iSCSI is enabled for Longhorn
      ansible.builtin.service:
        name: iscsid
        state: started
        enabled: true

    - name: Install the SUDO-owned platform CA
      ansible.builtin.copy:
        src: "{{ shell_platform_registry_ca_source }}"
        dest: "{{ shell_platform_registry_ca_dest }}"
        owner: root
        group: root
        mode: "0644"
      notify:
        - Refresh platform CA
        - Restart K3s after trust changes
        - Wait for K3s readiness

    - name: Flush CA and K3s handlers before completing host preparation
      ansible.builtin.meta: flush_handlers

  handlers:
    - name: Refresh platform CA
      ansible.builtin.command:
        argv: [update-ca-certificates]
      changed_when: true
    - name: Restart K3s after trust changes
      ansible.builtin.service:
        name: k3s
        state: restarted
    - name: Wait for K3s readiness
      ansible.builtin.command:
        argv: [k3s, kubectl, get, --raw=/readyz]
      register: shell_platform_k3s_ready
      changed_when: false
      retries: 30
      delay: 2
      until: shell_platform_k3s_ready.stdout | trim == 'ok'
