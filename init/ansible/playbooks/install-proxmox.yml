---
# Install the Debian host packages. Network cutover and guest creation are
# separate playbook stages so a failed reboot has a bounded recovery path.
- name: Install Proxmox on the Debian nested host
  hosts: proxmox_host
  gather_facts: true
  become: true
  vars_files:
    - ../vars/proxmox.yml
  vars:
    proxmox_release_suite: trixie
    proxmox_release_key_url: >-
      https://enterprise.proxmox.com/debian/proxmox-archive-keyring-trixie.gpg
    # Public checksum published in the Proxmox VE 9 repository guide.
    proxmox_release_key_sha256: >- # gitleaks:allow
      136673be77aba35dcce385b28737689ad64fd785a797e57897589aed08db6e45
  tasks:
    - name: Require Debian 13 before installing Proxmox
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Debian"
          - ansible_distribution_major_version == "13"
        fail_msg: >-
          Proxmox installation is supported only on Debian 13 in this slice.

    - name: Require the reviewed Proxmox package version
      ansible.builtin.assert:
        that:
          - >-
            shell_proxmox_package_version is
            match('^[0-9][A-Za-z0-9.+:~_-]*$')

    - name: Set the Proxmox host name
      ansible.builtin.hostname:
        name: "{{ proxmox_host_name | default(inventory_hostname) }}"

    - name: Resolve the Proxmox management address
      ansible.builtin.set_fact:
        proxmox_management_address: "{{ ansible_default_ipv4.address }}"

    - name: Remove the Debian loopback host mapping
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127[.]0[.]1[.]1\s+'
        state: absent
        mode: "0644"

    - name: Map the Proxmox host name to its management address
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: "^{{ proxmox_management_address | regex_escape }}\\s+"
        line: >-
          {{ proxmox_management_address }}
          {{ proxmox_host_name | default(inventory_hostname) }}
        mode: "0644"

    - name: Install the Proxmox archive key
      ansible.builtin.get_url:
        url: "{{ proxmox_release_key_url }}"
        dest: /usr/share/keyrings/proxmox-archive-keyring.gpg
        checksum: "sha256:{{ proxmox_release_key_sha256 }}"
        owner: root
        group: root
        mode: "0644"

    - name: Configure the no-subscription Proxmox repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/shell-proxmox.sources
        owner: root
        group: root
        mode: "0644"
        content: |
          Types: deb
          # Proxmox publishes this lab repository over HTTP; APT verifies the
          # signed release metadata with the pinned archive key above. Use the
          # enterprise feed or a reviewed internal mirror for production.
          URIs: http://download.proxmox.com/debian/pve
          Suites: {{ proxmox_release_suite }}
          Components: pve-no-subscription
          Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg

    - name: Disable the subscription-only Proxmox repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/pve-enterprise.sources
        owner: root
        group: root
        mode: "0644"
        content: |
          Types: deb
          URIs: https://enterprise.proxmox.com/debian/pve
          Suites: trixie
          Components: pve-enterprise
          Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
          Enabled: no

    - name: Install the Proxmox host packages
      ansible.builtin.apt:
        name:
          - ifupdown2
          - lvm2
          - nftables
          - proxmox-default-kernel
          - proxmox-ve
          - "pve-manager={{ shell_proxmox_package_version }}"
          - qemu-server
        state: present
        update_cache: true
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: Read the installed Proxmox manager version
      ansible.builtin.command:
        argv: [dpkg-query, -W, "-f=${Version}", pve-manager]
      changed_when: false
      register: installed_proxmox_version

    - name: Require the pinned Proxmox manager version
      ansible.builtin.assert:
        that: >-
          installed_proxmox_version.stdout == shell_proxmox_package_version
