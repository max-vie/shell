---
# Read-only K3s foundation verification. Run it against one cluster group at
# a time; it does not inspect or change workloads owned by MAKE.
- name: Verify each K3s server runtime
  hosts: "{{ shell_k3s_target_group }}"
  serial: 1
  gather_facts: false
  any_errors_fatal: true
  become: true
  vars_files:
    - ../vars/k3s.yml
  pre_tasks:
    - name: Validate the complete K3s target
      ansible.builtin.import_tasks: tasks/require-k3s-target.yml
      tags: [always]

    - name: Require the selected K3s cluster contract
      ansible.builtin.assert:
        that:
          - shell_k3s_api_endpoint is defined
          - shell_k3s_api_endpoint is match('^https://[A-Za-z0-9.-]+:6443$')
          - shell_k3s_api_host is defined
          - shell_k3s_version is defined
          - shell_k3s_helm_version is defined
          - shell_k3s_helm_path is defined
          - shell_k3s_helm_sha256 is match('^[0-9a-f]{64}$')
          - shell_k3s_cilium_chart_version == '1.18.2'
          - shell_k3s_cilium_chart_sha256 is match('^[0-9a-f]{64}$')
          - shell_k3s_cilium_images is mapping
          - shell_k3s_cilium_configuration is mapping
        fail_msg: The selected K3s verification contract is incomplete.

    - name: Require the Proxmox K3s API VIP contract
      ansible.builtin.assert:
        that:
          - shell_k3s_api_vip_enabled | bool
          - shell_k3s_api_vip_address == '10.66.0.200'
          - shell_k3s_api_endpoint == 'https://10.66.0.200:6443'
          - shell_k3s_api_host == '10.66.0.200'
        fail_msg: The Proxmox K3s verification must use API VIP 10.66.0.200.
      when: shell_k3s_target_group == 'proxmox_k3s_servers'

    - name: Keep the direct-GCP verification on its OpenTofu API endpoint
      ansible.builtin.assert:
        that:
          - not (shell_k3s_api_vip_enabled | bool)
        fail_msg: The direct-GCP verification must not use the Proxmox API VIP.
      when: shell_k3s_target_group == 'gcp_k3s_servers'

  tasks:

    - name: Wait for the selected K3s guests
      ansible.builtin.wait_for_connection:
        connect_timeout: 10
        timeout: 300

    - name: Gather K3s server service facts
      ansible.builtin.service_facts:

    - name: Inspect private K3s runtime files
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ shell_k3s_binary_dest }}"
        - "{{ shell_k3s_config_dir }}/config.yaml"
        - "{{ shell_k3s_token_dest }}"
        - "{{ shell_k3s_config_dir }}/k3s.yaml"
        - "{{ shell_k3s_data_dir }}/server/db/etcd/member"
      register: shell_k3s_runtime_files

    - name: Inspect the installed Helm binary
      ansible.builtin.stat:
        path: "{{ shell_k3s_helm_dest }}"
        checksum_algorithm: sha256
        follow: false
      register: shell_k3s_helm_file

    - name: Inspect the Kube-VIP manifest
      ansible.builtin.stat:
        path: "{{ shell_k3s_data_dir }}/server/manifests/kube-vip.yml"
      register: shell_k3s_kube_vip_manifest
      when: shell_k3s_api_vip_enabled | bool

    - name: Require the private Kube-VIP manifest
      ansible.builtin.assert:
        that:
          - shell_k3s_kube_vip_manifest.stat.exists
          - shell_k3s_kube_vip_manifest.stat.isreg
          - shell_k3s_kube_vip_manifest.stat.mode == '0600'
        fail_msg: The Proxmox K3s API VIP manifest is missing or world-readable.
      when: shell_k3s_api_vip_enabled | bool

    - name: Require the server runtime and embedded etcd member
      ansible.builtin.assert:
        that:
          - >-
            ansible_facts.services.get(shell_k3s_service_name ~ '.service',
            {}).state == 'running'
          - >-
            ansible_facts.services.get(shell_k3s_service_name ~ '.service',
            {}).status == 'enabled'
          - shell_k3s_runtime_files.results[0].stat.exists
          - shell_k3s_runtime_files.results[0].stat.isreg
          - shell_k3s_runtime_files.results[0].stat.mode == '0755'
          - shell_k3s_runtime_files.results[1].stat.exists
          - shell_k3s_runtime_files.results[1].stat.isreg
          - shell_k3s_runtime_files.results[1].stat.mode == '0600'
          - shell_k3s_runtime_files.results[2].stat.exists
          - shell_k3s_runtime_files.results[2].stat.isreg
          - shell_k3s_runtime_files.results[2].stat.mode == '0600'
          - shell_k3s_runtime_files.results[3].stat.exists
          - shell_k3s_runtime_files.results[3].stat.isreg
          - shell_k3s_runtime_files.results[3].stat.mode == '0600'
          - shell_k3s_runtime_files.results[4].stat.exists
          - shell_k3s_runtime_files.results[4].stat.isdir
          - shell_k3s_helm_file.stat.exists
          - shell_k3s_helm_file.stat.isreg
          - shell_k3s_helm_file.stat.mode == '0755'
          - shell_k3s_helm_file.stat.checksum == shell_k3s_helm_sha256
        fail_msg: >-
          {{ inventory_hostname }} does not meet the private K3s service,
          configuration, token, kubeconfig, or embedded-etcd contract.

    - name: Verify the installed Helm client version
      ansible.builtin.command:
        argv: ["{{ shell_k3s_helm_dest }}", version, --short]
      changed_when: false
      register: shell_k3s_helm_version_check

    - name: Require the installed Helm client version
      ansible.builtin.assert:
        that:
          - shell_k3s_helm_version in shell_k3s_helm_version_check.stdout
        fail_msg: The installed Helm client does not match the private supply.

- name: Verify the K3s cluster endpoint and node set
  hosts: "{{ shell_k3s_target_group }}"
  gather_facts: false
  become: true
  vars_files:
    - ../vars/k3s.yml
  pre_tasks:
    - name: Validate the complete K3s target
      ansible.builtin.import_tasks: tasks/require-k3s-target.yml
      tags: [always]

  tasks:
    - name: Wait for every declared K3s node to become Ready
      ansible.builtin.command:
        argv:
          - "{{ shell_k3s_binary_dest }}"
          - kubectl
          - wait
          - --for=condition=Ready
          - nodes
          - --all
          - --timeout=180s
      changed_when: false
      run_once: true

    - name: Read the K3s node set and versions
      ansible.builtin.command:
        argv: ["{{ shell_k3s_binary_dest }}", kubectl, get, nodes, -o, json]
      changed_when: false
      register: shell_k3s_nodes
      run_once: true

    - name: Derive the observed K3s node names and versions
      ansible.builtin.set_fact:
        shell_k3s_observed_nodes: >-
          {{ (shell_k3s_nodes.stdout | from_json).items |
             map(attribute='metadata.name') | list }}
        shell_k3s_observed_versions: >-
          {{ (shell_k3s_nodes.stdout | from_json).items |
             map(attribute='status.nodeInfo.kubeletVersion') | list }}
      run_once: true

    - name: Require the exact Ready K3s node set and version
      ansible.builtin.assert:
        that:
          - >-
            shell_k3s_observed_nodes | sort ==
            groups[shell_k3s_target_group] | sort
          - shell_k3s_observed_versions | length == 3
          - >-
            shell_k3s_observed_versions |
            select('equalto', shell_k3s_version) |
            list | length == 3
        fail_msg: >-
          The live K3s node set or version does not match the private contract.
      run_once: true

    - name: Verify the Cilium agent DaemonSet
      ansible.builtin.command:
        argv:
          - "{{ shell_k3s_binary_dest }}"
          - kubectl
          - -n
          - kube-system
          - rollout
          - status
          - daemonset/cilium
          - --timeout=300s
      changed_when: false
      run_once: true

    - name: Verify the Cilium Envoy DaemonSet
      ansible.builtin.command:
        argv:
          - "{{ shell_k3s_binary_dest }}"
          - kubectl
          - -n
          - kube-system
          - rollout
          - status
          - daemonset/cilium-envoy
          - --timeout=300s
      changed_when: false
      run_once: true

    - name: Verify the Cilium operator deployment
      ansible.builtin.command:
        argv:
          - "{{ shell_k3s_binary_dest }}"
          - kubectl
          - -n
          - kube-system
          - rollout
          - status
          - deployment/cilium-operator
          - --timeout=300s
      changed_when: false
      run_once: true

    - name: Read the Cilium configuration map
      ansible.builtin.command:
        argv:
          - "{{ shell_k3s_binary_dest }}"
          - kubectl
          - --kubeconfig={{ shell_k3s_config_dir }}/k3s.yaml
          - -n
          - kube-system
          - get
          - configmap/cilium-config
          - -o
          - json
      changed_when: false
      register: shell_k3s_cilium_config
      run_once: true

    - name: Derive the Cilium configuration data
      ansible.builtin.set_fact:
        shell_k3s_cilium_config_data: >-
          {{ (shell_k3s_cilium_config.stdout | from_json).data }}
      run_once: true

    - name: Read the deployed Cilium image references
      ansible.builtin.command:
        argv:
          - "{{ shell_k3s_binary_dest }}"
          - kubectl
          - --kubeconfig={{ shell_k3s_config_dir }}/k3s.yaml
          - -n
          - kube-system
          - get
          - daemonset/cilium
          - daemonset/cilium-envoy
          - deployment/cilium-operator
          - -o
          - "jsonpath={range .items[*].spec.template.spec.initContainers[*]}{.image}{'\\n'}{end}{range .items[*].spec.template.spec.containers[*]}{.image}{'\\n'}{end}"  # yamllint disable-line rule:line-length
      changed_when: false
      register: shell_k3s_observed_cilium_images
      run_once: true

    - name: Read the kube-proxy DaemonSet absence
      ansible.builtin.command:
        argv:
          - "{{ shell_k3s_binary_dest }}"
          - kubectl
          - --kubeconfig={{ shell_k3s_config_dir }}/k3s.yaml
          - -n
          - kube-system
          - get
          - daemonset/kube-proxy
      changed_when: false
      failed_when: false
      register: shell_k3s_kube_proxy
      run_once: true

    - name: Require the Cilium kube-proxy replacement configuration
      ansible.builtin.assert:
        that:
          - shell_k3s_cilium_config_data['kube-proxy-replacement'] == 'true'
          - shell_k3s_cilium_config_data['cni-exclusive'] == 'true'
          - shell_k3s_cilium_config_data['bpf-lb-sock'] == 'true'
          - shell_k3s_cilium_config_data['bpf-lb-sock-hostns-only'] == 'true'
          - >-
            shell_k3s_cilium_config_data['tunnel-protocol'] ==
            shell_k3s_cilium_configuration.tunnel_protocol
          - >-
            shell_k3s_cilium_config_data['cluster-pool-ipv4-cidr'] ==
            shell_k3s_pod_cidr
          - shell_k3s_kube_proxy.rc != 0
          - >-
            (shell_k3s_observed_cilium_images.stdout_lines | unique | sort) ==
            [
              shell_k3s_cilium_images.agent.repository ~ ':' ~
              shell_k3s_cilium_images.agent.tag ~ '@' ~
              shell_k3s_cilium_images.agent.digest,
              shell_k3s_cilium_images.envoy.repository ~ ':' ~
              shell_k3s_cilium_images.envoy.tag ~ '@' ~
              shell_k3s_cilium_images.envoy.digest,
              shell_k3s_cilium_images.operator.repository ~ ':' ~
              shell_k3s_cilium_images.operator.tag ~ '@' ~
              shell_k3s_cilium_images.operator.digest
            ] | sort
        fail_msg: >-
          The live Cilium configuration does not match the private contract.
      run_once: true

    - name: Verify the Kube-VIP control-plane DaemonSet
      ansible.builtin.command:
        argv:
          - "{{ shell_k3s_binary_dest }}"
          - kubectl
          - -n
          - kube-system
          - rollout
          - status
          - daemonset/kube-vip-ds
          - --timeout=180s
      changed_when: false
      run_once: true
      when: shell_k3s_api_vip_enabled | bool

    - name: Verify the stable K3s API endpoint
      ansible.builtin.command:
        argv:
          - "{{ shell_k3s_binary_dest }}"
          - kubectl
          - --kubeconfig={{ shell_k3s_config_dir }}/k3s.yaml
          - "--server={{ shell_k3s_api_endpoint }}"
          - "--tls-server-name={{ shell_k3s_api_host }}"
          - get
          - --raw=/readyz
      changed_when: false
      register: shell_k3s_endpoint_ready
      failed_when: shell_k3s_endpoint_ready.stdout | trim != 'ok'
      run_once: true
