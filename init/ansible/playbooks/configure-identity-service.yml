---
# Preview the selected AlmaLinux 9, FreeIPA domain, and DNS boundary without
# reading private credentials or changing the identity host.
- name: Preview the deferred identity service
  hosts: identity_nodes
  gather_facts: false
  any_errors_fatal: true
  vars_files:
    - ../vars/contracts.yml
  pre_tasks:
    - name: Validate all public SUDO access contracts
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - >-
            {{ playbook_dir
            }}/../../../sudo/scripts/validate_access_contracts.py
      check_mode: false
      changed_when: false
      become: false
      delegate_to: localhost
      run_once: true
      tags: [always]

    - name: Load the public identity host profile
      ansible.builtin.include_vars:
        file: >-
          {{ playbook_dir }}/../../../sudo/access/freeipa-host-profile.json
        name: shell_identity_profile
      become: false
      delegate_to: localhost
      run_once: true
      tags: [always]

    - name: Require the current identity execution boundary
      ansible.builtin.assert:
        that:
          - shell_identity_profile.policy_owner == 'sudo'
          - "'init' in shell_identity_profile.consumer_owners"
          - shell_identity_profile.proof_status == 'source-only'
          - >-
            shell_identity_profile.inventory_group
            == shell_identity_inventory_group
          - shell_identity_profile.host.name == 'identity-01'
          - shell_identity_profile.host.fqdn == 'identity-01.shell.internal'
          - shell_identity_profile.host.ip_address == '10.77.0.210'
          - shell_identity_profile.host.operating_system == 'almalinux-9'
          - shell_identity_profile.identity.domain == 'shell.internal'
          - shell_identity_profile.identity.realm == 'SHELL.INTERNAL'
          - shell_identity_profile.identity.dns_forwarders | length == 2
          - >-
            shell_identity_profile.required_contracts.operating_system.status
            == 'source-defined'
          - >-
            shell_identity_profile.required_contracts.operating_system.value
            == 'almalinux-9'
          - >-
            shell_identity_profile.required_contracts.operating_system.decision
            == 'man/docs/adr/006-use-almalinux-9-for-freeipa-identity-host.md'
          - >-
            shell_identity_profile.required_contracts.identity_configuration.status
            == 'source-defined'
          - >-
            shell_identity_profile.secret_contract.private_values_tracked
            == false
          - shell_identity_profile.execution.owner == 'init'
          - shell_identity_profile.execution.mode == 'contract-preview'
          - >-
            shell_identity_profile.execution.status ==
            'blocked-by-required-contracts'
          - >-
            shell_identity_profile.required_contracts.artifact_supply.status
            == 'not-defined'
          - >-
            shell_identity_profile.required_contracts.identity_credentials.status
            == 'source-defined'
          - >-
            shell_identity_profile.required_contracts.identity_credentials.handoff_status
            == 'not-defined'
          - groups[shell_identity_inventory_group] | length == 1
          - >-
            shell_identity_profile.host.name in
            groups[shell_identity_inventory_group]
          - >-
            hostvars[shell_identity_profile.host.name].ansible_host ==
            shell_identity_profile.host.ip_address
        fail_msg: >-
          The SUDO identity profile, INIT inventory, or deferred contract
          boundary has changed.
      become: false
      delegate_to: localhost
      run_once: true
      tags: [always]

    - name: Require the selected identity inventory host
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'identity-01'
          - ansible_host == '10.77.0.210'
          - shell_expected_address == '10.77.0.210'
          - shell_role | default('') == shell_identity_role
          - shell_cluster | default('') == shell_identity_cluster
          - shell_transport | default('') == shell_identity_transport
          - (ansible_user | default('')) is string
          - (ansible_user | default('')) | length > 0
          - (ansible_user | default('')) != 'root'
        fail_msg: The selected host does not match the identity contract.
      tags: [always]

    - name: Refuse identity mutation while runtime handoffs are incomplete
      ansible.builtin.fail:
        msg: >-
          Identity mutation is not authorized by the source-only contracts.
          Complete the private credential and AlmaLinux image and artifact
          handoffs before extending this playbook.
      when: not ansible_check_mode
      tags: [always]

  tasks:
    - name: Describe the deferred identity configuration
      ansible.builtin.debug:
        msg: >-
          Identity configuration remains blocked until INIT supplies a
          reviewed AlmaLinux 9 image, TAR defines the identity artifact
          supply, and SUDO provides the private credential handoff.
      when: ansible_check_mode

    - name: Stop after the identity contract preview
      ansible.builtin.meta: end_play
      when: ansible_check_mode
