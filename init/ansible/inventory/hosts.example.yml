---
# Example only. The working inventory belongs under .local/ and must provide
# the private SSH route and user for the selected execution environment.
# The renderer writes the generated inventory to .local/ansible/inventory.json;
# keep that file private and never commit it.
all:
  children:
    proxmox_host:
      vars:
        proxmox_host_name: proxmox-host
        shell_proxmox_uplink_interface: replace-with-gcp-uplink-interface
        shell_proxmox_data_device: replace-with-proxmox-data-device
      hosts:
        proxmox-host:
          ansible_host: replace-with-proxmox-host-gcp-private-address
          shell_expected_address: replace-with-proxmox-host-gcp-private-address
          shell_transport: gcp_iap
    gcp_guests:
      vars:
        ansible_python_interpreter: /usr/bin/python3
        ansible_user: replace-with-os-login-user
        # Generated inventory receives the authoritative project ID from
        # OpenTofu; this placeholder is for the static example only.
        gcp_project_id: replace-with-gcp-project-id
        gcp_known_hosts_file: replace-with-private-known-hosts-file
        # The private inventory must also supply the SSH agent/key and a
        # reviewed known_hosts file. The host name and zone come from the
        # renderer, so the IAP route cannot silently target another VM.
        ansible_ssh_common_args: >-
          -o ProxyCommand="gcloud compute start-iap-tunnel
          {{ inventory_hostname | quote }} %p --listen-on-stdin
          --project={{ gcp_project_id | quote }}
          --zone={{ gcp_zone | quote }}"
          -o UserKnownHostsFile={{ gcp_known_hosts_file | quote }}
          -o StrictHostKeyChecking=yes
      children:
        gcp_shared_nodes: {}
        gcp_k3s_servers: {}
    gcp_debian_guests:
      children:
        delivery_nodes: {}
        gcp_k3s_servers: {}
    shell_nodes:
      children:
        gcp_shared_nodes:
          hosts:
            identity-01:
              ansible_host: 10.77.0.210
              shell_expected_address: 10.77.0.210
              shell_role: identity
              shell_cluster: shared
              shell_transport: gcp_iap
              shell_operating_system: almalinux-9
              gcp_zone: europe-west4-a
            delivery-01:
              ansible_host: 10.77.0.211
              shell_expected_address: 10.77.0.211
              shell_role: delivery
              shell_cluster: shared
              shell_transport: gcp_iap
              shell_operating_system: debian-13
              gcp_zone: europe-west4-b
        gcp_k3s_servers:
          vars:
            shell_inventory_k3s_api_address: replace-with-gcp-k3s-api-address
            shell_inventory_k3s_api_endpoint: >-
              https://replace-with-gcp-k3s-api-address:6443
            shell_inventory_k3s_api_host: replace-with-gcp-k3s-api-address
          hosts:
            gcp-k3s-01:
              ansible_host: 10.77.0.201
              shell_expected_address: 10.77.0.201
              shell_role: k3s
              shell_cluster: gcp
              shell_transport: gcp_iap
              shell_operating_system: debian-13
              gcp_zone: europe-west4-a
            gcp-k3s-02:
              ansible_host: 10.77.0.202
              shell_expected_address: 10.77.0.202
              shell_role: k3s
              shell_cluster: gcp
              shell_transport: gcp_iap
              shell_operating_system: debian-13
              gcp_zone: europe-west4-b
            gcp-k3s-03:
              ansible_host: 10.77.0.203
              shell_expected_address: 10.77.0.203
              shell_role: k3s
              shell_cluster: gcp
              shell_transport: gcp_iap
              shell_operating_system: debian-13
              gcp_zone: europe-west4-c
        proxmox_k3s_servers:
          vars:
            shell_inventory_k3s_api_address: 10.66.0.200
            shell_inventory_k3s_api_endpoint: https://10.66.0.200:6443
            shell_inventory_k3s_api_host: 10.66.0.200
          hosts:
            proxmox-k3s-01:
              ansible_host: 10.66.0.201
              shell_expected_address: 10.66.0.201
              shell_address_cidr: 10.66.0.201/24
              shell_role: k3s
              shell_cluster: proxmox
              shell_transport: proxmox_ssh
              shell_operating_system: debian-13
            proxmox-k3s-02:
              ansible_host: 10.66.0.202
              shell_expected_address: 10.66.0.202
              shell_address_cidr: 10.66.0.202/24
              shell_role: k3s
              shell_cluster: proxmox
              shell_transport: proxmox_ssh
              shell_operating_system: debian-13
            proxmox-k3s-03:
              ansible_host: 10.66.0.203
              shell_expected_address: 10.66.0.203
              shell_address_cidr: 10.66.0.203/24
              shell_role: k3s
              shell_cluster: proxmox
              shell_transport: proxmox_ssh
              shell_operating_system: debian-13
    identity_nodes:
      hosts:
        identity-01: {}
    delivery_nodes:
      hosts:
        delivery-01: {}
